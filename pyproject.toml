[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-doctor"
version = "0.11.0"
description = "Rank slow Apache Impala queries and turn one exported profile into a deterministic diagnosis, without raw SQL or profiles leaving the machine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Aleksandr Efimov" },
]
maintainers = [
    { name = "Aleksandr Efimov" },
]
keywords = [
    "apache-impala",
    "apache-trino",
    "big-data",
    "cloudera-manager",
    "container",
    "diagnostics",
    "docker",
    "kubernetes",
    "lakehouse",
    "query-analysis",
    "sql",
    "trino",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.16.6",
]
e2e = [
    "playwright>=1.62.0",
]
impala = [
    # HiveServer2 transport for read-only metadata collection. The kerberos
    # extra pulls pykerberos, which puresasl needs for the GSSAPI handshake.
    "impyla[kerberos]>=0.24.0,<0.25",
]
postgres = [
    "psycopg[binary]>=3.2.13,<4",
]

[project.scripts]
query-doctor-analyze = "query_doctor.cli.analyze_profile:main"
query-doctor-batch-recent = "query_doctor.cli.batch_recent:main"
query-doctor-cleanup-generated = "query_doctor.cli.cleanup_generated:main"
query-doctor-cm-events = "query_doctor.cli.cm_events:main"
query-doctor-cm-sample-smoke = "query_doctor.cli.cm_sample_smoke:main"
query-doctor-collect-cm-profiles = "query_doctor.cli.collect_cm_profiles:main"
query-doctor-collect-impala-context = "query_doctor.cli.collect_impala_context:main"
query-doctor-collect-impala-profile = "query_doctor.cli.collect_impala_profile:main"
query-doctor-collect-spark-history = "query_doctor.cli.collect_spark_history:main"
query-doctor-corpus-smoke = "query_doctor.cli.corpus_smoke:main"
query-doctor-demo = "query_doctor.cli.demo_data:main"
query-doctor-demo-preflight = "query_doctor.cli.demo_preflight:main"
query-doctor-deployment-readiness = "query_doctor.cli.deployment_readiness:main"
query-doctor-diagnose-spark-compact = "query_doctor.cli.diagnose_spark_compact:main"
query-doctor-diagnose-trino-compact = "query_doctor.cli.diagnose_trino_compact:main"
query-doctor-optimize-query = "query_doctor.cli.optimize_query:main"
query-doctor-pipeline = "query_doctor.cli.pipeline:main"
query-doctor-report = "query_doctor.cli.report:main"
query-doctor-recent-history-operator-readiness = "query_doctor.cli.recent_history_operator_readiness:main"
query-doctor-recent-history-postgres-readiness = "query_doctor.cli.recent_history_postgres_readiness:main"
query-doctor-recent-history-retention = "query_doctor.cli.recent_history_retention:main"
query-doctor-recent-profile-remediation = "query_doctor.cli.recent_profile_remediation:main"
query-doctor-recent-profile-worker = "query_doctor.cli.recent_profile_worker:main"
query-doctor-self-test = "query_doctor.cli.self_test:main"
query-doctor-build-spark-evidence-package = "query_doctor.cli.build_spark_evidence_package:main"
query-doctor-export-spark-evidence-fixtures = "query_doctor.cli.export_spark_evidence_fixtures:main"
query-doctor-validate-spark-evidence-package = "query_doctor.cli.validate_spark_evidence_package:main"
query-doctor-trino-coordinator-query-info-target-check = "query_doctor.cli.trino_coordinator_query_info_target_check:main"
query-doctor-trino-coordinator-query-info-pruned-probe = "query_doctor.cli.trino_coordinator_query_info_pruned_probe:main"
query-doctor-trino-coordinator-query-info-pruned-import = "query_doctor.cli.trino_coordinator_query_info_pruned_import:main"
query-doctor-trino-event-store-import = "query_doctor.cli.trino_event_store_import:main"
query-doctor-trino-event-source-contract-check = "query_doctor.cli.trino_event_source_contract_check:main"
query-doctor-trino-http-event-archive-import = "query_doctor.cli.trino_http_event_archive_import:main"
query-doctor-trino-http-query-detail-archive-import = "query_doctor.cli.trino_http_query_detail_archive_import:main"
query-doctor-trino-import = "query_doctor.cli.trino_import:main"
query-doctor-trino-metadata-cli-summary = "query_doctor.cli.trino_metadata_cli_summary:main"
query-doctor-trino-metadata-source-contract-check = "query_doctor.cli.trino_metadata_source_contract_check:main"
query-doctor-trino-metadata-summary-import = "query_doctor.cli.trino_metadata_summary_import:main"
query-doctor-trino-query-detail-import = "query_doctor.cli.trino_query_detail_import:main"
query-doctor-trino-query-info-pruned-import = "query_doctor.cli.trino_query_info_pruned_import:main"
query-doctor-trino-query-list-import = "query_doctor.cli.trino_query_list_import:main"
query-doctor-trino-statement-stats-import = "query_doctor.cli.trino_statement_stats_import:main"
query-doctor-web = "query_doctor.cli.web:main"

[project.urls]
Homepage = "https://github.com/alexandrefimov/Query-Doctor"
Repository = "https://github.com/alexandrefimov/Query-Doctor"
Issues = "https://github.com/alexandrefimov/Query-Doctor/issues"
Documentation = "https://github.com/alexandrefimov/Query-Doctor/blob/main/docs/README.md"

[tool.setuptools.packages.find]
include = ["query_doctor*"]

[tool.setuptools.package-data]
"query_doctor.web.static" = ["*.css", "*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "cases",
    "legacy",
]

[tool.ruff.lint]
# Start with correctness checks that should be safe for the existing tree.
# Broaden this set only after fixing or intentionally ignoring current findings.
select = ["E9", "F63", "F7", "F82"]
